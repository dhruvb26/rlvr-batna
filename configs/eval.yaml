# COMPLETED RUN MATRIX (15 trained learners, nine opponent models).
# MAIN: Surplus, Selective .4, Uniform .4 x seeds42/43/44 x all nine opponents.
#   81 learner/opponent combinations x 517 = 41,877 episodes.
# TAU .6: Selective .6 x seeds42/43/44 x GPT-5.4, GPT-5.4-mini, Qwen3.6 Tinker.
#   9 combinations x 517 = 4,653 episodes.
# TAU .2: Selective .2 x seeds42/43/44 x those same three opponents.
#   9 combinations x 517 = 4,653 episodes.
# BASE: untrained Qwen3.6 Tinker vs GPT-5.4 direct, 517 episodes.
# REGULATION OFF: Surplus + Selective .4 x all three seeds, price baseline, 600.
# MATCHED ON: Surplus + Selective .4 seed42, price baseline, 200 fresh episodes.
# TOTAL: 52,500 unique completed revision evaluation episodes.
#
# HISTORICAL ROUTE / PROTOCOL QUALIFICATIONS:
# - Original GPT-5.4 Surplus/Selective .4 seed42 main runs used OpenRouter and v2.
