# CONSOLIDATED EVALUATION CONFIG — exactly one active learner/opponent matchup.
# Active: completed Surplus seed43 step80 vs direct-OpenAI GPT-5.4, regulation ON,
# five main manifests (517 episodes). Nested baseline scores need no extra calls.
#   uv run --locked python main.py eval --config configs/eval.yaml
# This is paid inference. Editing this file never starts a job automatically.
#
# SWITCHING RUNS:
# 1. Comment out the active matchups block and uncomment ONE eval_runs block below.
#    Each block replaces the whole matchups list; keep common top-level settings.
# 2. For another opponent, replace that matchup's opponent mapping using the
#    opponent blocks below. Use the documented token cap and provider route.
# 3. For regulation sensitivity, replace the datasets/settings with the price
#    baseline block; use only the learners and guard mode listed in the run matrix.
# 4. Change storage_dir to describe the selected run. No automatic matrix expansion
#    or custom profile loader is used. Do not leave duplicate top-level YAML keys.
# Evaluation seed always stays 42; training seeds belong to the saved learners.

datasets:
  - name: amazon
    data_path: data/ahp/test
    manifest_path: data/evaluation_manifests/revision/main/amazon.json
    comparison_manifest_path: data/evaluation_manifests/revision/baseline/amazon.json
  - name: casino
    manifest_path: data/evaluation_manifests/revision/main/casino.json
    comparison_manifest_path: data/evaluation_manifests/revision/baseline/casino.json
    data_path: data/casino/ca.test.csv
  - name: dnd
    manifest_path: data/evaluation_manifests/revision/main/dnd.json
    comparison_manifest_path: data/evaluation_manifests/revision/baseline/dnd.json
    data_path: data/dnd/dnd.test.csv
  - name: craigslist
    data_path: data/craigslist/revision/test.json
    manifest_path: data/evaluation_manifests/revision/main/craigslist.json
    comparison_manifest_path: data/evaluation_manifests/revision/baseline/craigslist.json
  - name: ji
    manifest_path: data/evaluation_manifests/revision/main/ji.json
    comparison_manifest_path: data/evaluation_manifests/revision/baseline/ji.json
    data_path: data/ji/ji.test.json
num_episodes: 100
repeats: 1
max_turns: 12
max_concurrent: 4
temperature: 0.7
top_p: 1.0
seed: 42
economic_regulation: true
storage_dir: ./logs/eval/revision/surplus-seed43-gpt54-openai
matchups:
  - learner:
      label: qwen3.6-35b-a3b-surplus-temp1-seed43-step80
      provider: tinker
      model: tinker://aeea1a21-00dd-573f-8fd2-f987a881faa8:train:0/sampler_weights/final
      renderer_name: qwen3_5_disable_thinking
      max_tokens: 512
    opponent:
      label: gpt-5.4-openai
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: gpt-5.4
      max_tokens: 512
tinker_project_id: 0f0bd816-b353-44c0-8faf-356f84ef16d0

