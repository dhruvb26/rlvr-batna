# save_every: 1
# END train:smoke-1024

# HISTORICAL DIAGNOSTICS — separate from the 15 retained paper runs.
# The degraded Surplus reference used learner temperature .7 (seed147).
# The adopted fresh confirmation changes that temperature to 1.0 at LR 3e-5.
# Optimizer-preserving diagnostic forks from batch10 changed ONLY temperature to
# 1.0, or ONLY learning rate to 1e-5, and stopped at batch40. Those forks require
# scripts/fork_training.py and their saved parent/checkpoint metadata; setting
# load_checkpoint_path or editing this fresh-run YAML is not an equivalent resume.
# Do not mix diagnostic/smoke runs into the three-seed paper averages.

